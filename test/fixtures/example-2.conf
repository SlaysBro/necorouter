! Example router configuration for WAN and firewall connectivity.
! te0 faces ISP, te1 faces the firewall.
hostname example-2
ip domain-name example.local
ntp timezone utc+3
ntp server 172.16.2.1
!
username net_admin
 password P@ssw0rd
 role admin
!
interface isp
 ip address 172.16.2.2/28
 ip nat outside
!
interface fw
 description firewall
 ip address 192.168.1.1/30
 ip nat inside
!
interface tunnel.0
 ip address 10.10.10.2/30
 ip mtu 1400
 ip tunnel 172.16.2.2 172.16.1.2 mode gre
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 P@ssw0rd
!
port te0
 service-instance te0/isp
  encapsulation untagged
  connect ip interface isp
!
port te1
 service-instance te1/fw
  encapsulation untagged
  connect ip interface fw
!
router ospf 1
 ospf router-id 10.10.10.2
 passive-interface default
 no passive-interface tunnel.0
 network 10.10.10.0/30 area 0
 network 192.168.1.0/30 area 0
 network 192.168.3.0/28 area 0
 area 0 authentication message-digest
!
ip nat pool inside-pool 192.168.3.1-192.168.3.14
ip nat source dynamic example-2-to-isp pool inside-pool overload 172.16.2.2
ip nat source static tcp 192.168.3.2 8080 172.16.2.2 8080
ip nat source static tcp 192.168.3.2 2027 172.16.2.2 2027
!
ip route 0.0.0.0/0 172.16.2.1
end
