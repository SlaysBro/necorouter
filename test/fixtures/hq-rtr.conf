! HQ-RTR: example for Task 1 of the demo exam (the participant chooses the addressing).
! Ports: te0 faces ISP, te1 faces HQ-SW (trunk with VLAN 100/200/999).
! Mapping of te0/te1 to Linux NICs is in /etc/necorouter/ports.map
hostname hq-rtr
ip domain-name au-team.irpo
ntp timezone utc+3
!
username net_admin
 password P@ssw0rd
 role admin
!
interface isp
 ip address 172.16.1.2/28
 ip nat outside
!
interface vl100
 description HQ-SRV
 ip address 192.168.100.1/27
 ip nat inside
!
interface vl200
 description HQ-CLI
 ip address 192.168.200.1/28
 ip nat inside
 dhcp-server 1
!
interface vl999
 description MGMT
 ip address 192.168.99.1/29
 ip nat inside
!
interface tunnel.0
 ip address 10.10.10.1/30
 ip mtu 1400
 ip tunnel 172.16.1.2 172.16.2.2 mode gre
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 P@ssw0rd
!
port te0
 service-instance te0/isp
  encapsulation untagged
  connect ip interface isp
!
port te1
 service-instance te1/vl100
  encapsulation dot1q 100 exact
  rewrite pop 1
  connect ip interface vl100
 service-instance te1/vl200
  encapsulation dot1q 200 exact
  rewrite pop 1
  connect ip interface vl200
 service-instance te1/vl999
  encapsulation dot1q 999 exact
  rewrite pop 1
  connect ip interface vl999
!
ip pool hq-cli 192.168.200.2-192.168.200.14
dhcp-server 1
 pool hq-cli 1
 mask 28
 gateway 192.168.200.1
 dns 192.168.100.2
 domain-name au-team.irpo
!
router ospf 1
 ospf router-id 10.10.10.1
 passive-interface default
 no passive-interface tunnel.0
 network 10.10.10.0/30 area 0
 network 192.168.100.0/27 area 0
 network 192.168.200.0/28 area 0
 network 192.168.99.0/29 area 0
 area 0 authentication message-digest
!
ip nat pool HQ-SRV 192.168.100.1-192.168.100.30
ip nat pool HQ-CLI 192.168.200.1-192.168.200.14
ip nat source dynamic srv-to-isp pool HQ-SRV overload 172.16.1.2
ip nat source dynamic cli-to-isp pool HQ-CLI overload 172.16.1.2
ip nat source static tcp 192.168.100.2 8080 172.16.1.2 8080
ip nat source static tcp 192.168.100.2 2027 172.16.1.2 2027
!
ip route 0.0.0.0/0 172.16.1.1
end
